<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VideoStitch</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-page">
    <main class="popup-card">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <div><strong>VideoStitch</strong><small>LOCAL-FIRST VIDEO EDITOR</small></div>
      </header>
      <section class="hero">
        <span class="eyebrow">READY WHEN YOU ARE</span>
        <h1>Make the cut.<br /><em>Keep control.</em></h1>
        <p>Open your editing workspace, bring in media locally, and review every AI proposal before it changes the timeline.</p>
      </section>
      <button id="open-editor" class="primary" type="button">Open VideoStitch <span aria-hidden="true">↗</span></button>
      <div class="boundary"><span aria-hidden="true">✓</span><p><strong>Zero page access</strong><small>This extension cannot read tabs, page content, or video files.</small></p></div>
      <footer><span id="destination">Local editor</span><button id="open-options" type="button">Change URL</button></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
